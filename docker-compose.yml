services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: db_listings
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-}
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_URL: jdbc:mariadb://db:3306/db_listings
    ports:
      - "${SERVER_PORT:-8083}:8083"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
