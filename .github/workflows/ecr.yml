name: Publicar imagen docker en aws

on:
  push:
    branches:
      - aws

jobs:
  build-and-push-main:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repo
        uses: actions/checkout@v4

      # 1. Configurar entorno de ejecución Java 21
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # 2. Compilar la aplicación y generar el JAR temporal
      - name: Compilar y empaquetar con Maven
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      # 3. Paso de seguridad: Verificar que el JAR exista antes de Docker
      - name: Verificar generación del archivo JAR
        run: |
          echo "=== Listando contenido de la carpeta target ==="
          ls -la target/

      # 4. Configurar credenciales de acceso a AWS
      - name: Configurar credenciales de aws
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 5. Autenticarse en Amazon ECR
      - name: Iniciar sesion en aws ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 6. Garantizar que el repositorio destino exista en AWS
      - name: Crear repositorio ECR si no existe
        run: |
          aws ecr describe-repositories --repository-names publication-service --region ${{ secrets.AWS_REGION }} || \
          aws ecr create-repository --repository-name publication-service --region ${{ secrets.AWS_REGION }}

      # 7. Construir imagen Docker utilizando la carpeta target/ válida
      - name: Construir y publicar en aws
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/publication-service:latest
