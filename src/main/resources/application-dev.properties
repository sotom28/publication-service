spring.application.name=publication-service


# Conexión limpia usando el conector de MariaDB
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
# Ahora ponemos la contraseña que asignaste en el Paso 1
spring.datasource.password=${DB_PASSWORD}


# Configuración de Hibernate segura
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# Puerto de escucha del servidor
server.port=8083
#  para que la salida de la consola sea más legible, habilitamos el soporte de colores ANSI
spring.output.ansi.enabled=always